name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Every route renders on request, so the build needs no database or secrets.
      - run: npm run build

  layout:
    name: Every page, workflow and screen size, in a browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearpath
          POSTGRES_PASSWORD: clearpath
          POSTGRES_DB: clearpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clearpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clearpath:clearpath@localhost:5432/clearpath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate a throwaway session key
        run: echo "SESSION_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run db:setup
      - run: npm run build
      - run: npm run test:layout
      - run: npm run test:workflows
      - name: Every page and every action, watched for errors
        run: npm run test:sweep
        env:
          SWEEP_ACTIONS: "1"
      - name: Keep the screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: .qa/layout
          retention-days: 7
